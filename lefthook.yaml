pre-commit:
  parallel: false
  exclude:
    - .pixi/
  commands:
    1-local-stop:
      run: pixi run -e dev local stop

    2-fmt:
      run: pixi run -e dev fmt

    3-lint:
      run: pixi run -e dev lint

    4-types:
      run: pixi run -e dev types

    5-imports:
      run: pixi run -e dev imports

    6-test:
      run: pixi run -e test test

    7-check-clean:
      run: git diff --exit-code

local-pre-commit:
  parallel: false
  exclude:
    - .pixi/
  commands:
    1-local-start:
      run: pixi run -e dev local start

    2-fmt:
      run: pixi run -e dev fmt

    3-lint:
      run: pixi run -e dev lint

    4-types:
      run: pixi run -e dev types

    5-imports:
      run: pixi run -e dev imports

    6-test:
      run: pixi run -e test test
